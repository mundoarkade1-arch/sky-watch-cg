name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run unit tests and build Debug APK
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --console=plain --no-daemon

      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p dist
          cp android-app/app/build/outputs/apk/debug/app-debug.apk \
            "dist/SKY-WATCH-CG-${GITHUB_REF_NAME}-debug.apk"

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v1
        with:
          name: SKY WATCH CG ${{ github.ref_name }} — Prévia Debug
          body: |
            APK instalável de prévia/teste, gerado da variante Debug.

            - Pacote Android: `com.skywatch.cg.debug` (instala em paralelo à versão Release).
            - Inclui a grade SIROS e o radar ADS-B ainda experimental.
            - A agenda usa horários locais de Campo Grande e destaca uma faixa de 3 horas com mais movimentos programados SIROS; isso não confirma operação real nem cobre necessariamente todos os movimentos do aeroporto.
            - Não é uma versão assinada para distribuição estável nem para publicação na Play Store.
            - A chave Debug do CI pode mudar entre execuções; para instalar uma nova prévia, talvez seja necessário desinstalar a anterior, apagando os dados locais.
            - A integração ADS-B aguarda confirmação de condições com a fonte; status operacional Aena não está integrado.

            Para instalar, baixe o APK em um aparelho Android e permita a instalação para o aplicativo usado para abrir o arquivo.
          prerelease: true
          files: dist/SKY-WATCH-CG-${{ github.ref_name }}-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



