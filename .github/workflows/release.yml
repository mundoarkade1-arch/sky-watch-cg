name: Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release version
        id: version
        shell: bash
        env:
          WORKFLOW_RUN_NUMBER: ${{ github.run_number }}
        run: |
          last_tag_number="$(git tag --list 'v1.0.*' \
            | sed -nE 's/^v1\.0\.([0-9]+)$/\1/p' \
            | sort -n \
            | tail -n 1)"
          release_number="$WORKFLOW_RUN_NUMBER"
          if [[ -n "$last_tag_number" && "$last_tag_number" -ge "$release_number" ]]; then
            release_number=$((last_tag_number + 1))
          fi
          echo "number=$release_number" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ runner.temp }}/keystore.jks
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

      - name: Build signed release APK
        working-directory: android-app
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ steps.version.outputs.number }}
          VERSION_NAME: 1.0.${{ steps.version.outputs.number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --console=plain --no-daemon

      - name: Prepare stable release asset
        shell: bash
        run: |
          test -f android-app/app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp android-app/app/build/outputs/apk/release/app-release.apk dist/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ steps.version.outputs.number }}
          generate_release_notes: true
          files: dist/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
